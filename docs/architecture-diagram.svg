<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" role="img" aria-label="SESAP architecture: Coded App to Maestro to RPA to Data Fabric and back">
        <defs>
          <marker id="ah" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto">
            <path d="M0,0 L8,4 L0,8 Z" fill="#586576"></path>
          </marker>
          <marker id="ahg" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto">
            <path d="M0,0 L8,4 L0,8 Z" fill="#137a3a"></path>
          </marker>
          <marker id="aha" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto">
            <path d="M0,0 L8,4 L0,8 Z" fill="#0057b8"></path>
          </marker>
        </defs>

        <!-- return arrow (drawn first, behind boxes): Data Fabric -> App, over the top -->
        <path d="M660,250 L660,20 L380,20 L380,42" fill="none" stroke="#137a3a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ahg)"></path>
        <rect x="392" y="10" width="150" height="20" rx="5" fill="#e2f2e8"></rect>
        <text x="467" y="24" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#137a3a" font-weight="700">⑥ app reflects (read)</text>

        <!-- App -> Data Fabric (write) -->
        <path d="M490,80 L560,250" fill="none" stroke="#0057b8" stroke-width="2" marker-end="url(#aha)"></path>
        <rect x="497" y="150" width="132" height="20" rx="5" fill="#e7f0fb"></rect>
        <text x="563" y="164" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#0057b8" font-weight="700">① create ticket</text>

        <!-- RPA -> Data Fabric (write-back) -->
        <path d="M490,520 L560,410" fill="none" stroke="#0057b8" stroke-width="2" marker-end="url(#aha)"></path>
        <rect x="486" y="452" width="150" height="20" rx="5" fill="#e7f0fb"></rect>
        <text x="561" y="466" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#0057b8" font-weight="700">⑤ write-back status</text>

        <!-- App -> Maestro -->
        <line x1="380" y1="120" x2="380" y2="256" stroke="#586576" stroke-width="2" marker-end="url(#ah)"></line>
        <rect x="388" y="178" width="150" height="20" rx="5" fill="#eef2f7"></rect>
        <text x="463" y="192" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#26364b" font-weight="700">② act → start process</text>

        <!-- Maestro -> RPA -->
        <line x1="380" y1="346" x2="380" y2="482" stroke="#586576" stroke-width="2" marker-end="url(#ah)"></line>
        <rect x="388" y="404" width="128" height="20" rx="5" fill="#eef2f7"></rect>
        <text x="452" y="418" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#26364b" font-weight="700">③ invoke robot</text>

        <!-- RPA -> Anthropic -->
        <line x1="270" y1="512" x2="212" y2="500" stroke="#586576" stroke-width="1.6" marker-end="url(#ah)"></line>
        <!-- RPA -> Gmail -->
        <line x1="270" y1="544" x2="212" y2="556" stroke="#586576" stroke-width="1.6" marker-end="url(#ah)"></line>
        <text x="150" y="470" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="10.5" fill="#586576">④ AI triage / notify</text>

        <!-- BOXES -->
        <!-- App -->
        <rect x="270" y="42" width="220" height="78" rx="12" fill="#ffffff" stroke="#0057b8" stroke-width="2"></rect>
        <text x="380" y="70" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="10" fill="#0057b8" letter-spacing="1">FRONT END</text>
        <text x="380" y="90" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="800" fill="#0f1a2b">Coded App</text>
        <text x="380" y="108" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11.5" fill="#586576">React + TypeScript SDK</text>

        <!-- Maestro -->
        <rect x="270" y="262" width="220" height="84" rx="12" fill="#ffffff" stroke="#c9d4e2" stroke-width="1.5"></rect>
        <text x="380" y="290" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="10" fill="#586576" letter-spacing="1">ORCHESTRATION</text>
        <text x="380" y="310" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="800" fill="#0f1a2b">Maestro (BPMN)</text>
        <text x="380" y="328" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11.5" fill="#586576">TicketLifecycle · gateways</text>

        <!-- RPA -->
        <rect x="270" y="488" width="220" height="84" rx="12" fill="#ffffff" stroke="#c9d4e2" stroke-width="1.5"></rect>
        <text x="380" y="516" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="10" fill="#586576" letter-spacing="1">THE HANDS</text>
        <text x="380" y="536" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="800" fill="#0f1a2b">RPA robot</text>
        <text x="380" y="554" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11.5" fill="#586576">TicketAutomation v2.0.13</text>

        <!-- Data Fabric -->
        <rect x="560" y="250" width="170" height="160" rx="12" fill="#f5f7fa" stroke="#0057b8" stroke-width="2"></rect>
        <text x="645" y="300" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="10" fill="#0057b8" letter-spacing="1">SYSTEM OF RECORD</text>
        <text x="645" y="322" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="800" fill="#0f1a2b">Data Fabric</text>
        <text x="645" y="342" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11.5" fill="#586576">Ticket entity</text>
        <text x="645" y="366" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="10.5" fill="#137a3a" font-weight="700">AssignmentStatus</text>
        <text x="645" y="382" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10.5" fill="#586576">Unassigned → Assigned</text>

        <!-- Externals -->
        <rect x="40" y="480" width="172" height="40" rx="9" fill="#f5f7fa" stroke="#c9d4e2" stroke-width="1.3"></rect>
        <text x="126" y="504" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#26364b">Anthropic · Claude</text>
        <rect x="40" y="536" width="172" height="40" rx="9" fill="#f5f7fa" stroke="#c9d4e2" stroke-width="1.3"></rect>
        <text x="126" y="560" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#26364b">Gmail · Integration Svc</text>
      </svg>
